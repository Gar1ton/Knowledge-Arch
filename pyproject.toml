# 工具链配置。约定：测试绿是 TODO 标 [x] 的前提；domain 层启用严格类型检查。
# [project] 为独立应用（standalone）版本线的版本源；完整打包配置（extras/entry
# points/build-system）在 Phase 7 落地。

[project]
name = "knowledge-arch"
version = "0.1.0"
description = "原件中心的知识库系统：PDF 原件管理、五档检索/RAG、LightRAG 图谱、Zotero/R2/Notion 同步"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"               # 异步测试免写事件循环样板
pythonpath = [".", "tests/mocks"]   # 让测试可 import ka_core 与测试替身
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]      # 基础错误 + 未用 + import 排序 + 语法升级

[tool.mypy]
python_version = "3.10"
strict = true
files = ["ka_core/domain/"]            # 至少对零依赖的 domain 层严格把关
