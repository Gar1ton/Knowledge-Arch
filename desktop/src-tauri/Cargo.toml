[package]
name = "knowledge-arch"
version = "2.0.5"
description = "Knowledge Arch desktop shell"
authors = ["Knowledge Arch"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "knowledge_arch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
dirs = "6"
tauri-plugin-updater = { version = "2", optional = true }

[features]
# 自动更新：需要在 tauri.conf.json 里配置 updater 公钥与端点（发布流水线由
# desktop/scripts/configure_release.py 写入）。本地构建默认不启用。
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
